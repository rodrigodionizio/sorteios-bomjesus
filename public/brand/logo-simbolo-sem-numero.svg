<!--
  Variante do símbolo SEM o "65" do brasão.

  Existe por um motivo específico: na casa central da cartela de bingo, o
  "65" é um número válido da coluna O — quem está marcando com caneta pode
  entender que aquela casa foi sorteada. Sem o número, sobra a silhueta do
  ticket picotado, que não se confunde com dezena nenhuma.

  Use só na grade da cartela. Nos carimbos e no resto do sistema continua
  valendo o símbolo completo.
-->
<svg viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="tm">
      <rect width="120" height="120" fill="white"/>
      <circle cx="35" cy="5" r="7" fill="black"/>
      <circle cx="35" cy="115" r="7" fill="black"/>
      <circle cx="35" cy="22.5" r="3.5" fill="black"/>
      <circle cx="35" cy="37.5" r="3.5" fill="black"/>
      <circle cx="35" cy="52.5" r="3.5" fill="black"/>
      <circle cx="35" cy="67.5" r="3.5" fill="black"/>
      <circle cx="35" cy="82.5" r="3.5" fill="black"/>
      <circle cx="35" cy="97.5" r="3.5" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#tm)">
    <path d="M 10 15 A 10 10 0 0 1 20 5 L 35 5 L 35 115 L 20 115 A 10 10 0 0 1 10 105 Z" fill="#2A0D13"/>
    <path d="M 35 5 L 100 5 A 10 10 0 0 1 110 15 L 110 105 A 10 10 0 0 1 100 115 L 35 115 Z" fill="#2A0D13"/>
  </g>
  <polygon points="72.5,44 78,60 72.5,76 67,60" fill="#FCECCB" opacity="0.92"/>
